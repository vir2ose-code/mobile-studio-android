name: Build Android .AAB & .APK (Mobile Studio)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build-android:
    name: Build Mobile Studio AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore app/release.jks \
            -alias mobilestudio -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vir2osesound -keypass vir2osesound \
            -dname "CN=Waldemar Krucinski, OU=vir2ose sound, O=vir2osesound, L=Berlin, ST=Berlin, C=DE"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release Android App Bundle (.aab)
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle_bundle.log

      - name: Build Release APK (.apk)
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_apk.log

      - name: Prepare Output Artifacts
        run: |
          mkdir -p output_binaries
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found AAB at: $AAB_FILE"
          echo "Found APK at: $APK_FILE"
          cp "$AAB_FILE" output_binaries/MobileStudio_PlayStore_Release.aab
          cp "$APK_FILE" output_binaries/MobileStudio_Direct_Install.apk
          cp app/release.jks output_binaries/release.keystore
          ls -lh output_binaries/

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_GooglePlay_AAB
          path: output_binaries/MobileStudio_PlayStore_Release.aab
          retention-days: 14

      - name: Upload Direct Install APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Install_APK
          path: output_binaries/MobileStudio_Direct_Install.apk
          retention-days: 14

      - name: Upload Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Release_Keystore
          path: output_binaries/release.keystore
          retention-days: 14

      - name: Post Failure Log Comment
        if: failure()
        run: |
          LOG_CONTENT=$(tail -n 60 gradle_bundle.log 2>/dev/null | python3 -c 'import sys, json; print(json.dumps(sys.stdin.read()))')
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -d "{\"body\": \"Build failure log:\n\`\`\`\n$LOG_CONTENT\n\`\`\`\"}" || true
