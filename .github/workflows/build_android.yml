name: Build Android .AAB & .APK (Mobile Studio)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build-android:
    name: Build Mobile Studio AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore app/release.jks \
            -alias mobilestudio -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vir2osesound -keypass vir2osesound \
            -dname "CN=Waldemar Krucinski, OU=vir2ose sound, O=vir2osesound, L=Berlin, ST=Berlin, C=DE"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release Android App Bundle (.aab)
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace > gradle_bundle.log 2>&1 || {
            EXIT_CODE=$?
            tail -n 100 gradle_bundle.log
            exit $EXIT_CODE
          }

      - name: Build Release APK (.apk)
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > gradle_apk.log 2>&1 || {
            EXIT_CODE=$?
            tail -n 100 gradle_apk.log
            exit $EXIT_CODE
          }

      - name: Prepare Output Artifacts
        run: |
          mkdir -p output_binaries
          echo "=== All build outputs ==="
          find app/build/outputs -type f -ls || true

          AAB_FILE=$(find app/build -type f -name "*.aab" | head -n 1)
          APK_FILE=$(find app/build -type f -name "*.apk" | head -n 1)

          echo "AAB target: $AAB_FILE"
          echo "APK target: $APK_FILE"

          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" output_binaries/MobileStudio_PlayStore_Release.aab
          fi

          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output_binaries/MobileStudio_Direct_Install.apk
          fi

          if [ -f "app/release.jks" ]; then
            cp app/release.jks output_binaries/release.keystore
          fi

          echo "=== Prepared Binaries ==="
          ls -lh output_binaries/

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_GooglePlay_AAB
          path: output_binaries/MobileStudio_PlayStore_Release.aab
          retention-days: 14

      - name: Upload Direct Install APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Install_APK
          path: output_binaries/MobileStudio_Direct_Install.apk
          retention-days: 14

      - name: Upload Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Release_Keystore
          path: output_binaries/release.keystore
          retention-days: 14

      - name: Post Failure Log Comment
        if: failure()
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          log_text = ""
          for fname in ['gradle_bundle.log', 'gradle_apk.log']:
              if os.path.exists(fname):
                  with open(fname, 'r', errors='ignore') as f:
                      content = f.read()
                      lines = content.splitlines()
                      errors = [l for l in lines if l.startswith('e: ') or 'FAILURE:' in l or 'error:' in l.lower()]
                      if errors:
                          log_text += f"\n=== {fname} Errors ===\n" + "\n".join(errors[:40])
                      else:
                          log_text += f"\n=== {fname} Tail ===\n" + "\n".join(lines[-40:])

          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          sha = os.environ.get('GITHUB_SHA')

          if token and repo and sha and log_text:
              body_data = json.dumps({'body': f"### Build Failure Details:\n```\n{log_text}\n```"}).encode('utf-8')
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
                  data=body_data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github.v3+json',
                      'User-Agent': 'Actions',
                      'Content-Type': 'application/json'
                  }
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print("Comment posted:", resp.status)
              except Exception as e:
                  print("Failed to post comment:", e)
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
