name: Build Android .AAB & .APK (Mobile Studio)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build-android:
    name: Build Mobile Studio AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore app/release.jks \
            -alias mobilestudio -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vir2osesound -keypass vir2osesound \
            -dname "CN=Waldemar Krucinski, OU=vir2ose sound, O=vir2osesound, L=Berlin, ST=Berlin, C=DE"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Release Android App Bundle (.aab)
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Build Release APK (.apk)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Output Artifacts
        run: |
          mkdir -p output_binaries
          echo "=== All build outputs ==="
          find app/build/outputs -type f -ls || true

          AAB_FILE=$(find app/build -type f -name "*.aab" | head -n 1)
          APK_FILE=$(find app/build -type f -name "*.apk" | head -n 1)

          echo "AAB target: $AAB_FILE"
          echo "APK target: $APK_FILE"

          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" output_binaries/MobileStudio_PlayStore_Release.aab
          fi

          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output_binaries/MobileStudio_Direct_Install.apk
          fi

          if [ -f "app/release.jks" ]; then
            cp app/release.jks output_binaries/release.keystore
          fi

          echo "=== Prepared Binaries ==="
          ls -lh output_binaries/

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_GooglePlay_AAB
          path: output_binaries/MobileStudio_PlayStore_Release.aab
          retention-days: 14

      - name: Upload Direct Install APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Install_APK
          path: output_binaries/MobileStudio_Direct_Install.apk
          retention-days: 14

      - name: Upload Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Release_Keystore
          path: output_binaries/release.keystore
          retention-days: 14
